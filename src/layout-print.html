<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Jost';src:url('assets/fonts/jost.woff2') format('woff2');font-weight:300 700;font-display:swap}
@font-face{font-family:'Bodoni Moda';src:url('assets/fonts/bodoni.woff2') format('woff2');font-weight:400 900;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2A2825;font-family:'Jost',system-ui,sans-serif;color:#EFEAE1;padding:24px}
.note{max-width:760px;margin:0 auto 26px;background:#131211;padding:22px 26px;box-shadow:inset 0 0 0 1px rgba(239,234,225,.13)}
.note h1{font-family:'Bodoni Moda',Georgia,serif;font-size:1.5rem;font-weight:450;margin-bottom:10px}
.note p{font-size:.88rem;line-height:1.7;color:#B3ABA0}
.note p+p{margin-top:8px}
.note b{color:#C6A265;font-weight:500}
.note button{margin-top:16px;font:inherit;font-size:.68rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  background:#C6A265;color:#0A0A09;border:0;padding:12px 22px;cursor:pointer}

/* ---- La planche A4 ---- */
/* À l'écran, la planche garde ses dimensions A4 : on la fait défiler
   plutôt que de casser la mise en page sur un petit écran. */
.sheetwrap{overflow-x:auto;padding-bottom:8px}
.sheet{width:210mm;min-height:297mm;margin:0 auto;background:#fff;color:#14120E;display:flex;flex-direction:column}
.tent{height:148.5mm;display:flex;flex-direction:column;position:relative}
.tent+.tent{border-top:1px dashed #C9C3B6}
/* Le haut est retourné : une fois la carte pliée, les deux faces se lisent à l'endroit. */
.face{height:74.25mm;display:flex;align-items:center;gap:12mm;padding:0 16mm}
.face--flip{transform:rotate(180deg)}
.fold{position:absolute;left:0;right:0;top:74.25mm;border-top:1px dashed #C9C3B6}
.fold span{position:absolute;right:4mm;top:-4mm;font-size:6pt;letter-spacing:.2em;text-transform:uppercase;color:#A39C8E;background:#fff;padding:0 2mm}
.qr{width:42mm;height:42mm;flex:none}
.qr svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.txt{min-width:0}
.txt .em{display:flex;align-items:center;gap:3mm;color:#8A6A2F}
.txt .em svg{width:11mm;height:7mm}
.txt .em b{font-family:'Bodoni Moda',Georgia,serif;font-size:19pt;font-weight:500;letter-spacing:.01em;color:#14120E}
.txt h2{font-family:'Bodoni Moda',Georgia,serif;font-size:27pt;font-weight:450;line-height:1;margin:4mm 0 3mm}
.txt .fr{font-size:10.5pt;color:#3E3830;line-height:1.4}
.txt .en{font-size:9pt;color:#7A7266;font-style:italic;margin-top:1mm}
.txt .url{margin-top:4mm;font-size:8.5pt;font-weight:500;letter-spacing:.09em;color:#8A6A2F}
.rule{width:14mm;height:1pt;background:#C6A265;margin:3mm 0}

@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff;padding:0}
  .note{display:none}
  .sheetwrap{overflow:visible;padding:0}
  .sheet{width:auto;min-height:auto;margin:0;box-shadow:none}
  .tent{height:148.5mm;break-inside:avoid}
}
</style>
</head>
<body>
{{content}}
</body>
</html>
