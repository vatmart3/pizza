<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#1B1915">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="La Mesa — Les Pierres Blanches">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>(function(){try{var h=document.documentElement;if(sessionStorage.getItem('lm-seen'))h.classList.add('no-loader');if(sessionStorage.getItem('lm-veil')){h.classList.add('is-transition');sessionStorage.removeItem('lm-veil')}}catch(e){}})();</script>
<link rel="preload" href="assets/fonts/fraunces-opsz.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
{{preload}}
<link rel="stylesheet" href="assets/css/main.css">
<script type="speculationrules">{"prefetch":[{"where":{"href_matches":"/*"},"eagerness":"moderate"}]}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Restaurant","name":"La Mesa — Les Pierres Blanches","url":"{{site}}","image":"{{og_image}}","telephone":"+33467533340","priceRange":"30 – 50 €","servesCuisine":["Méditerranéenne","Fruits de mer","Grillades"],"acceptsReservations":"True","address":{"@type":"PostalAddress","streetAddress":"65 allée Pierre Barthas","postalCode":"34200","addressLocality":"Sète","addressCountry":"FR"},"geo":{"@type":"GeoCoordinates","latitude":43.3934,"longitude":3.6802},"openingHoursSpecification":[{"@type":"OpeningHoursSpecification","dayOfWeek":["Tuesday","Wednesday","Thursday"],"opens":"09:30","closes":"23:00"},{"@type":"OpeningHoursSpecification","dayOfWeek":["Friday","Saturday"],"opens":"09:30","closes":"00:30"},{"@type":"OpeningHoursSpecification","dayOfWeek":"Sunday","opens":"09:30","closes":"18:00"}],"hasMenu":"{{site}}/carte.html","amenityFeature":[{"@type":"LocationFeatureSpecification","name":"Terrasse","value":true},{"@type":"LocationFeatureSpecification","name":"Vue mer","value":true}]}</script>
</head>
<body data-page="{{page}}" class="{{body_class}}">

{{> loader}}
<div class="veil" aria-hidden="true"><div class="veil__slat"></div><div class="veil__slat"></div><div class="veil__slat"></div><div class="veil__slat"></div><div class="veil__slat"></div><div class="veil__slat"></div><div class="veil__slat"></div><div class="veil__label"></div></div>
<div class="cursor" aria-hidden="true"><span class="cursor__label"></span></div>
<div class="grain" aria-hidden="true"></div>
{{> nav}}
<main id="main">
{{content}}
</main>
{{> footer}}
<div class="toast" role="status" aria-live="polite"></div>
<script src="assets/js/data.js" defer></script>
<script src="assets/js/app.js" defer></script>
</body>
</html>
